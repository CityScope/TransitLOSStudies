[project]
name = "city-science-network"
version = "0.1.0"
description = "Multi-city transit level-of-service case study built on transitLOS, UrbanAccessAnalyzer, geohierarchy, and pyCensus."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Miguel Ureña Pliego" }
]
dependencies = [
    "transitlos",
    "urbanaccessanalyzer",
    "geohierarchy",
    "pycensus",
    "geopandas>=0.14.0",
    "pandas>=2.3.3",
    "polars>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "matplotlib>=3.11.1",
    "folium>=0.15.0",
    "h3>=4.0.0",
    "rasterio>=1.3.0",
    "freestiler>=0.2.0",
    "pmtiles>=3.7.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
transitlos = { path = "../../transitLOS", editable = true }
urbanaccessanalyzer = { path = "../../UrbanAccessAnalyzer", editable = true }
geohierarchy = { path = "../../geohierarchy", editable = true }
pycensus = { path = "../../pyCensus", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["code"]
