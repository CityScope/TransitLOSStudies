<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transit Level of Service Maps</title>
<style>
  :root {
    --bg: #f4f6f8; --fg: #1b2430; --card: #fff; --border: #d9dee4; --accent: #0b6bcb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --fg: #e8ecf0; --card: #1b232c; --border: #2d3844; --accent: #5aa9ff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px 16px;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: clamp(1.5rem, 4vw, 2.25rem); text-align: center; margin: 0 0 32px; }
  .options { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%; max-width: 900px; }
  .option {
    flex: 1 1 220px; max-width: 280px; padding: 32px 20px; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    color: inherit; text-decoration: none; font-size: 1.25rem; font-weight: 600;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .option:hover, .option:focus-visible {
    transform: translateY(-3px); border-color: var(--accent);
    box-shadow: 0 6px 18px rgba(0,0,0,.12); outline: none;
  }
</style>
</head>
<body>
<h1>Choose your Transit level of service map</h1>
<nav class="options" id="options"></nav>

<script>
  // Edit this list to update labels or map URLs in the future.
  const MAPS = [
    { label: "City Science Network", url: "https://cs-futurecities.media.mit.edu/cs_transit_score/" },
    { label: "USA",                  url: "https://cs-futurecities.media.mit.edu/us_transit_los/" },
    { label: "Spain",                url: "https://cs-futurecities.media.mit.edu/spain_los/" },
  ];

  const container = document.getElementById("options");
  for (const { label, url } of MAPS) {
    const a = document.createElement("a");
    a.className = "option";
    a.href = url;
    a.textContent = label;
    container.appendChild(a);
  }
</script>
</body>
</html>
